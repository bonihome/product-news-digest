server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    root /srv/product-news-digest/dist;
    index index.html;

    access_log /var/log/nginx/product-news-digest.access.log;
    error_log /var/log/nginx/product-news-digest.error.log;

    client_max_body_size 20m;

    location /runtime/ {
        alias /srv/product-news-digest/public/runtime/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location /api/analytics/ {
        proxy_pass http://127.0.0.1:8787/api/analytics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

